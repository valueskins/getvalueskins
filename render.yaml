# Render Blueprint for STAGING (api-staging.valueskins.com). See docs/DEPLOYMENT.md.
#
# Production gets its own Blueprint or services later: a paid Postgres plan with
# backups (SPEC 2), NODE_ENV=production, live Razorpay keys, ENABLE_DEV_LOGIN=false
# (or removed), EMAIL_TRANSPORT=resend, COOKIE_DOMAIN=.valueskins.com and
# SESSION_COOKIE_NAME=vs_session. Do not copy this file over for production unchanged.
#
# Variables marked `sync: false` are prompted for in the dashboard when the
# Blueprint is first applied. Secrets never live in this file.

databases:
  - name: valueskins-staging-db
    # Free Render Postgres: expires 30 days after creation, no backups, no
    # point-in-time recovery. Fine for staging; see docs/DEPLOYMENT.md section 12.
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    # Internal connections only. Seed through Render Shell on the API service.
    ipAllowList: []

services:
  - type: web
    name: valueskins-api-staging
    runtime: node
    # Paid and always-on: OAuth callbacks and Meta callbacks cannot wait for a
    # free service to wake up (free services sleep after 15 minutes).
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
    # --prod=false: installs devDependencies (typescript) even if NODE_ENV=production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter "./packages/*" run build && pnpm --filter @valueskins/api run build
    preDeployCommand: pnpm --filter @valueskins/api run db:migrate:deploy
    startCommand: pnpm --filter @valueskins/api run start
    healthCheckPath: /api/health
    domains:
      - api-staging.valueskins.com
    envVars:
      # PORT is injected by Render (default 10000) and is intentionally not listed.
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: valueskins-staging-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://staging.valueskins.com
      - key: COOKIE_DOMAIN
        value: .valueskins.com
      - key: SESSION_COOKIE_NAME
        value: vs_session_staging
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://api-staging.valueskins.com/api/auth/instagram/callback
      - key: META_APP_SECRET
        sync: false
      # Razorpay TEST keys only. The API refuses to start with rzp_live_ outside production.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: 'ValueSkins <notifications@valueskins.com>'
      - key: EMAIL_TRANSPORT
        value: resend
      - key: ADMIN_INSTAGRAM_USER_IDS
        sync: false
      # The address users write to. DISPUTE_EMAIL is omitted on purpose: it defaults to this.
      - key: SUPPORT_EMAIL
        value: valueskinsfounder@gmail.com
      - key: ENABLE_DEV_LOGIN
        value: 'true'
      - key: AUTH_EMAIL_ENABLED
        value: 'true'
      - key: COMPANY_LEGAL_NAME
        value: Valueskins Private Limited
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_STATE
        sync: false
      # GST is charged (REPLACEMENT_PLAN 2.2), so a startup guard requires the GSTIN.
      - key: COMPANY_GSTIN
        sync: false
      - key: COMMISSION_SAC_CODE
        sync: false
      - key: GST_RATE_BPS
        value: '1800'
      # TEST_DATABASE_URL is omitted on purpose: Vitest-only, defaults to empty.
