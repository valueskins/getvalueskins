# Render Blueprint for PRODUCTION (api.valueskins.com). See docs/DEPLOYMENT.md section 21
# and docs/CUTOVER.md.
#
# Production runs FREE for now: the API on Render's free instance type, and the database on
# Neon's free plan, which is not on Render and so is not in this file. DATABASE_URL is a prompted
# variable holding Neon's direct connection string. Free instances have no pre-deploy command, so
# migrations are run by hand before each deploy that adds one (docs/DEPLOYMENT.md section 21.4),
# and the API refuses to start if the code has a migration the database has not applied. Moving to paid
# is described in docs/DEPLOYMENT.md section 21.9, and must happen before PAYMENTS_MODE or
# DEAL_POSTING_MODE leave `off`.
#
# STAGING is not in this file. The staging services already exist and are managed by hand in the
# Render dashboard (docs/DEPLOYMENT.md, "Staging is managed by hand"). Applying this Blueprint
# creates production only.
#
# Variables marked `sync: false` are prompted for in the dashboard when the
# Blueprint is first applied (or when a service is added to it), and are then owned
# by the dashboard: a later Blueprint sync leaves them alone. A variable with a
# `value:` is reset to that value by every sync, so never change one of those by hand.
# Secrets never live in this file.

services:
  # PRODUCTION. Starts closed: PAYMENTS_MODE and DEAL_POSTING_MODE are entered as `off`,
  # and no Razorpay variable is set (there are no live keys until the bank account is
  # ready). To open them later, first move to paid hosting (docs/DEPLOYMENT.md section
  # 21.9), then change the two modes in the dashboard and restart (section 16a). Do not
  # give them a `value:` here: a Blueprint sync would reset it.
  - type: web
    name: valueskins-api
    runtime: node
    # Render's free instance type: it spins down after 15 minutes without traffic and takes
    # about a minute to wake, scheduled jobs run only while it is awake, and Render may restart
    # it at any time. It has no pre-deploy command. Moving to paid is docs/DEPLOYMENT.md 21.9.
    plan: free
    region: singapore
    branch: main
    # Deployed by hand (Render: Manual Deploy), after staging has shown the change works,
    # and after any new migration has been run by hand against the production database
    # (docs/DEPLOYMENT.md section 21.4).
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
    # --prod=false: installs devDependencies (typescript) even if NODE_ENV=production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter "./packages/*" run build && pnpm --filter @valueskins/api run build
    # No preDeployCommand: free instances do not have one. The API never migrates on start or
    # in the build; it refuses to start when the code has a migration the database has not applied.
    startCommand: pnpm --filter @valueskins/api run start
    healthCheckPath: /api/health
    domains:
      - api.valueskins.com
    envVars:
      # PORT is injected by Render (default 10000) and is intentionally not listed.
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Neon's DIRECT connection string, ending in ?sslmode=require (docs/DEPLOYMENT.md
      # section 21.3). Not the pooled one: its host name contains "-pooler", and the API
      # refuses to start with it.
      - key: DATABASE_URL
        sync: false
      # Enter https://next.valueskins.com while production is being checked, then
      # https://valueskins.com at the switch (docs/CUTOVER.md step C2). No trailing slash.
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_DOMAIN
        value: .valueskins.com
      - key: SESSION_COOKIE_NAME
        value: vs_session
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # The same Meta app as the live app (docs/REPLACEMENT_PLAN.md section 1).
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://api.valueskins.com/api/auth/instagram/callback
      - key: META_APP_SECRET
        sync: false
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET are left out on
      # purpose while PAYMENTS_MODE is off. When payments open, add all three with the live
      # keys (docs/DEPLOYMENT.md section 16a); the API refuses to start without them.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: 'ValueSkins <notifications@valueskins.com>'
      - key: EMAIL_TRANSPORT
        value: resend
      # Enter `none` at first, then the admins' Instagram user ids, comma-separated.
      - key: ADMIN_INSTAGRAM_USER_IDS
        sync: false
      # The address users write to. DISPUTE_EMAIL is omitted on purpose: it defaults to this.
      - key: SUPPORT_EMAIL
        value: founder@valueskins.com
      # The variable must exist, and a startup guard refuses `true` in production.
      - key: ENABLE_DEV_LOGIN
        value: 'false'
      - key: AUTH_EMAIL_ENABLED
        value: 'false'
      # Error reporting (SPEC 20). The Node.js project's DSN from Sentry. Leave blank to turn it off.
      - key: SENTRY_DSN
        sync: false
      - key: COMPANY_LEGAL_NAME
        value: Valueskins Private Limited
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_STATE
        sync: false
      # GST is charged (REPLACEMENT_PLAN 2.2), so a startup guard requires the GSTIN even
      # while payments are off.
      - key: COMPANY_GSTIN
        sync: false
      - key: COMMISSION_SAC_CODE
        sync: false
      - key: GST_RATE_BPS
        value: '1800'
      # Launch gates (SPEC 19): enter `off` for both. Change them in the dashboard to open.
      - key: PAYMENTS_MODE
        sync: false
      - key: DEAL_POSTING_MODE
        sync: false
      # TEST_DATABASE_URL is omitted on purpose: Vitest-only, defaults to empty.
