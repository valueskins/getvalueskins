name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valueskins
          POSTGRES_PASSWORD: valueskins
          POSTGRES_DB: valueskins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valueskins -d valueskins_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://valueskins:valueskins@localhost:5432/valueskins_test
      TEST_DATABASE_URL: postgres://valueskins:valueskins@localhost:5432/valueskins_test
      WEB_ORIGIN: http://localhost:3000
      COOKIE_DOMAIN: ''
      SESSION_COOKIE_NAME: vs_session_ci
      SESSION_SECRET: ci-session-secret
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
      INSTAGRAM_APP_ID: ci-instagram-app-id
      INSTAGRAM_APP_SECRET: ci-instagram-app-secret
      INSTAGRAM_REDIRECT_URI: http://localhost:4000/api/auth/instagram/callback
      META_APP_SECRET: ci-meta-app-secret
      RAZORPAY_KEY_ID: rzp_test_fakeci000000000000
      RAZORPAY_KEY_SECRET: ci-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret
      RESEND_API_KEY: ci-resend-api-key
      BREVO_API_KEY: ''
      EMAIL_FROM: notifications@valueskins.com
      EMAIL_TRANSPORT: console
      ADMIN_INSTAGRAM_USER_IDS: ''
      SUPPORT_EMAIL: valueskinsfounder@gmail.com
      ENABLE_DEV_LOGIN: 'true'
      COMPANY_LEGAL_NAME: Valueskins Private Limited
      COMPANY_ADDRESS: 123 MG Road, Bengaluru
      COMPANY_STATE: Karnataka
      COMPANY_GSTIN: ''
      COMMISSION_SAC_CODE: '998399'
      AUTH_EMAIL_ENABLED: 'false'
      GST_RATE_BPS: '0'
      PAYMENTS_MODE: 'on'
      DEAL_POSTING_MODE: 'on'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SPEC 20: block on a critical advisory in what ships. The dev-only advisories (test runner,
      # bundler) are reported but do not block; docs/RUNBOOK.md lists the accepted ones.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Audit all dependencies (report only)
        run: pnpm audit
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
